<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meet.ai</title>
  <style>
    :root {
      --bg-primary: #0f172a;
      --bg-secondary: #1e293b;
      --border-color: #334155;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --accent-sky: #38bdf8;
      --accent-blue: #0284c7;
      --accent-red: #ef4444;
      --accent-green: #22c55e;
      --accent-yellow: #fbbf24;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 350px;
      margin: 0;
      padding: 14px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      user-select: none;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
      margin-bottom: 12px;
    }
    .title-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .logo-icon {
      font-size: 18px;
    }
    .title {
      font-size: 16px;
      font-weight: 800;
      color: var(--accent-sky);
    }
    .badge {
      font-size: 10px;
      padding: 3px 8px;
      border-radius: 9999px;
      background: #334155;
      color: #cbd5e1;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .badge.live {
      background: var(--accent-red);
      color: #ffffff;
      animation: pulse 1.5s infinite;
    }
    .badge.paused {
      background: #d97706;
      color: #ffffff;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }
    .info-box {
      font-size: 12px;
      color: #cbd5e1;
      background: var(--bg-secondary);
      padding: 10px 12px;
      border-radius: 8px;
      margin-bottom: 12px;
      border: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .meet-code-tag {
      font-family: monospace;
      font-weight: 700;
      color: var(--accent-sky);
      background: #090d16;
      padding: 2px 6px;
      border-radius: 4px;
    }
    /* Device Breakdown */
    .device-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }
    .stat-card {
      background: var(--bg-secondary);
      padding: 8px;
      border-radius: 8px;
      text-align: center;
      border: 1px solid var(--border-color);
    }
    .stat-val {
      font-size: 18px;
      font-weight: 800;
      color: var(--text-primary);
    }
    .stat-val.laptop { color: var(--accent-sky); }
    .stat-val.phone { color: var(--accent-yellow); }
    .stat-label {
      font-size: 10px;
      color: var(--text-secondary);
      margin-top: 2px;
    }
    .btn-action {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s;
      margin-bottom: 8px;
    }
    .btn-action:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .btn-primary {
      background: var(--accent-blue);
      color: #ffffff;
    }
    .btn-primary:hover:not(:disabled) {
      background: #0369a1;
    }
    .btn-sidepanel {
      background: #334155;
      color: #f8fafc;
      border: 1px solid #475569;
    }
    .btn-sidepanel:hover {
      background: #475569;
    }
    .btn-danger {
      background: var(--accent-red);
      color: #ffffff;
    }
    .btn-danger:hover:not(:disabled) {
      background: #dc2626;
    }
    .footer-note {
      font-size: 11px;
      text-align: center;
      color: var(--text-secondary);
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title-group">
      <span class="logo-icon">✨</span>
      <span class="title">Meet.ai</span>
    </div>
    <span id="statusBadge" class="badge">IDLE</span>
  </div>

  <div id="meetInfo" class="info-box">
    <span>Active Meet:</span>
    <span id="meetCodeDisplay" class="meet-code-tag">Checking...</span>
  </div>

  <div class="device-title">Device Breakdown</div>
  <div class="stats-grid">
    <div class="stat-card">
      <div id="totalCount" class="stat-val">0</div>
      <div class="stat-label">👥 Joined</div>
    </div>
    <div class="stat-card">
      <div id="desktopCount" class="stat-val laptop">0</div>
      <div class="stat-label">💻 Laptop</div>
    </div>
    <div class="stat-card">
      <div id="mobileCount" class="stat-val phone">0</div>
      <div class="stat-label">📱 Phone</div>
    </div>
  </div>

  <button id="openSidePanelBtn" class="btn-action btn-sidepanel">
    🚀 Open Side Panel Assistant
  </button>
  <button id="startBtn" class="btn-action btn-primary" disabled>
    ▶ Start Meeting Assistant
  </button>
  <button id="stopBtn" class="btn-action btn-danger" style="display: none;">
    ⏹ Stop & Save Report
  </button>

  <div class="footer-note">
    Live Hindi/English Captions, Laptop/Phone Tracker & AI Summary
  </div>

  <script src="popup.js"></script>
</body>
</html>
